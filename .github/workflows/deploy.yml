name: Build and deploy

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    name: Resolve deployment context
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.vars.outputs.deploy }}
      environment: ${{ steps.vars.outputs.environment }}
      environment_url: ${{ steps.vars.outputs.environment_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve variables
        id: vars
        shell: bash
        run: bash scripts/resolve-deployment-context.sh

      - name: Log resolved deployment context
        shell: bash
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          echo "deploy=${{ steps.vars.outputs.deploy }}"
          echo "environment=${{ steps.vars.outputs.environment }}"
          echo "environment_url=${{ steps.vars.outputs.environment_url }}"

  build:
    name: Build admin frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Log Node environment
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          echo "Installing dependencies with npm ci"
          npm ci

      - name: Build
        run: |
          echo "Building admin static files"
          npm run build
          echo "Build output:"
          find dist -maxdepth 2 -type f | sort

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy admin frontend
    runs-on: ubuntu-latest
    needs:
      - context
      - build
    if: needs.context.outputs.deploy == 'true'
    environment:
      name: ${{ needs.context.outputs.environment }}
      url: ${{ needs.context.outputs.environment_url }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ needs.context.outputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.context.outputs.environment }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download static artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: dist

      - name: Deploy over SSH
        shell: bash
        run: |
          echo "Deploying admin static artifact"
          echo "GitHub Environment: ${DEPLOY_ENVIRONMENT}"
          echo "Deploy root: ${DEPLOY_ROOT:-/opt/0x2c-blog}"
          bash scripts/deploy.sh
