name: Build and deploy

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  context:
    name: Resolve deployment context
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.vars.outputs.deploy }}
      environment: ${{ steps.vars.outputs.environment }}
      environment_url: ${{ steps.vars.outputs.environment_url }}
      image: ${{ steps.vars.outputs.image }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      default_app_port: ${{ steps.vars.outputs.default_app_port }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve variables
        id: vars
        shell: bash
        run: bash scripts/resolve-deployment-context.sh

  build:
    name: Build admin frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  container:
    name: Build and smoke test image
    runs-on: ubuntu-latest
    needs:
      - context
      - build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag zerox2c-blog-admin:test .

      - name: Smoke test Docker image
        shell: bash
        run: bash scripts/smoke-docker-image.sh zerox2c-blog-admin:test

      - name: Log in to GHCR
        if: needs.context.outputs.deploy == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push Docker image
        if: needs.context.outputs.deploy == 'true'
        env:
          IMAGE: ${{ needs.context.outputs.image }}
          IMAGE_TAG: ${{ needs.context.outputs.image_tag }}
        run: |
          docker tag zerox2c-blog-admin:test "${IMAGE}:sha-${GITHUB_SHA}"
          docker tag zerox2c-blog-admin:test "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:${IMAGE_TAG}"

  deploy:
    name: Deploy admin frontend
    runs-on: ubuntu-latest
    needs:
      - context
      - container
    if: needs.context.outputs.deploy == 'true'
    environment:
      name: ${{ needs.context.outputs.environment }}
      url: ${{ needs.context.outputs.environment_url }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ needs.context.outputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.context.outputs.environment }}
      IMAGE: ${{ needs.context.outputs.image }}:${{ needs.context.outputs.image_tag }}
      DEFAULT_APP_PORT: ${{ needs.context.outputs.default_app_port }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
      APP_HOST: ${{ secrets.APP_HOST }}
      APP_PORT: ${{ secrets.APP_PORT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy over SSH
        shell: bash
        run: bash scripts/deploy.sh
